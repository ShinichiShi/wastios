apiVersion: apps/v1
kind: Deployment
metadata:
  name: wastios-ml-service
  labels:
    app: wastios-ml-service
spec:
  replicas: {{ .Values.mlService.replicas }}
  selector:
    matchLabels:
      app: wastios-ml-service
  template:
    metadata:
      labels:
        app: wastios-ml-service
    spec:
      containers:
        - name: ml-service
          image: "{{ .Values.registry }}/{{ .Values.mlService.image }}:{{ .Values.mlService.tag }}"
          ports:
            - containerPort: {{ .Values.mlService.port }}
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.mlService.port }}
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: wastios-ml-service
spec:
  selector:
    app: wastios-ml-service
  ports:
    - port: {{ .Values.mlService.port }}
      targetPort: {{ .Values.mlService.port }}
