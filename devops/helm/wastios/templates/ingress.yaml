apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wastios
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: wastios-backend
                port:
                  number: {{ .Values.backend.port }}
          - path: /ml(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: wastios-ml-service
                port:
                  number: {{ .Values.mlService.port }}
          - path: /()(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: wastios-frontend
                port:
                  number: {{ .Values.frontend.port }}
