apiVersion: apps/v1
kind: Deployment
metadata:
  name: wastios-frontend
  labels:
    app: wastios-frontend
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      app: wastios-frontend
  template:
    metadata:
      labels:
        app: wastios-frontend
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.registry }}/{{ .Values.frontend.image }}:{{ .Values.frontend.tag }}"
          ports:
            - containerPort: {{ .Values.frontend.port }}
          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.frontend.port }}
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: wastios-frontend
spec:
  selector:
    app: wastios-frontend
  ports:
    - port: {{ .Values.frontend.port }}
      targetPort: {{ .Values.frontend.port }}
