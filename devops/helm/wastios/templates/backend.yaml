apiVersion: v1
kind: Secret
metadata:
  name: wastios-backend-env
type: Opaque
stringData:
  FIREBASE_PROJECT_ID: {{ .Values.backendSecret.FIREBASE_PROJECT_ID | quote }}
  FIREBASE_CLIENT_EMAIL: {{ .Values.backendSecret.FIREBASE_CLIENT_EMAIL | quote }}
  FIREBASE_PRIVATE_KEY: {{ .Values.backendSecret.FIREBASE_PRIVATE_KEY | quote }}
  FIREBASE_STORAGE_BUCKET: {{ .Values.backendSecret.FIREBASE_STORAGE_BUCKET | quote }}
  AWS_ACCESS_KEY_ID: {{ .Values.backendSecret.AWS_ACCESS_KEY_ID | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.backendSecret.AWS_SECRET_ACCESS_KEY | quote }}
  S3_BUCKET_NAME: {{ .Values.backendSecret.S3_BUCKET_NAME | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wastios-backend
  labels:
    app: wastios-backend
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      app: wastios-backend
  template:
    metadata:
      labels:
        app: wastios-backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.backend.port }}"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: backend
          image: "{{ .Values.registry }}/{{ .Values.backend.image }}:{{ .Values.backend.tag }}"
          ports:
            - containerPort: {{ .Values.backend.port }}
          envFrom:
            - secretRef:
                name: wastios-backend-env
          env:
            - name: PORT
              value: {{ .Values.backend.port | quote }}
            - name: ML_SERVICE_URL
              value: "http://wastios-ml-service:{{ .Values.mlService.port }}/predict"
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.backend.port }}
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.backend.port }}
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: wastios-backend
spec:
  selector:
    app: wastios-backend
  ports:
    - port: {{ .Values.backend.port }}
      targetPort: {{ .Values.backend.port }}
