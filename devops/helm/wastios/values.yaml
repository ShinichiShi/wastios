registry: localhost:8082

backend:
  image: wastios-backend
  tag: "3"
  port: 3000
  replicas: 1

frontend:
  image: wastios-frontend
  tag: "3"
  port: 80
  replicas: 1

mlService:
  image: wastios-ml-service
  tag: "3"
  port: 8000
  replicas: 1

# Defaults point at the local Firestore emulator + S3-mock containers
# (devops/terraform) so the backend boots without real cloud credentials.
# Swap these for real Firebase/AWS values to use the real services instead.
backendSecret:
  FIREBASE_PROJECT_ID: "demo-wastios"
  FIREBASE_CLIENT_EMAIL: ""
  FIREBASE_PRIVATE_KEY: ""
  FIREBASE_STORAGE_BUCKET: ""
  AWS_ACCESS_KEY_ID: "test"
  AWS_SECRET_ACCESS_KEY: "test"
  S3_BUCKET_NAME: "wastios-images"

# Host-side local emulators, reached from inside minikube via host.minikube.internal.
localEmulators:
  firestoreHost: "host.minikube.internal:8090"
  s3Endpoint: "http://host.minikube.internal:9090"

ingress:
  host: wastios.local
