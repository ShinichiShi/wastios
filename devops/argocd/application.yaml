apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: wastios
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ShinichiShi/wastios.git
    targetRevision: main
    path: devops/helm/wastios
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
